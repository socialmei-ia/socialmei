name: Temporary infra formatter

on:
  push:
    branches:
      - infra/team-migrations-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/team-migrations-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format infra files
        run: npx prettier --write tools/db-migrate.mjs docs/GITHUB-SETUP.md docs/ONBOARDING.md DEPLOYMENT.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/db-migrate.mjs docs/GITHUB-SETUP.md docs/ONBOARDING.md DEPLOYMENT.md
          git commit -m "Format infra foundation"
          git push origin HEAD:infra/team-migrations-foundation
