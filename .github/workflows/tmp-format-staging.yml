name: Temporary staging formatter

on:
  push:
    branches:
      - infra/staging-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/staging-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/STAGING.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STAGING.md
          git commit -m "Format staging documentation"
          git push origin HEAD:infra/staging-foundation
