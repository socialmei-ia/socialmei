services:
  postgres:
    image: postgres:16-alpine
    container_name: socialmei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: socialmei-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS}

      TZ: ${TZ}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

    volumes:
      - n8n_data:/home/node/.n8n

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: socialmei-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
    expose:
      - "80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  caddy:
    image: caddy:2-alpine
    container_name: socialmei-caddy
    restart: unless-stopped
    depends_on:
      - n8n
      - pgadmin
      - python-api
      - waha
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_HOST: ${N8N_HOST}
      PGADMIN_HOST: ${PGADMIN_HOST}
      WAHA_HOST: ${WAHA_HOST:-waha.54-94-213-7.sslip.io}
      PYTHON_API_HOST: ${PYTHON_API_HOST:-api.54-94-213-7.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  python-api:
    build:
      context: ./python-service
    container_name: socialmei-python
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  waha:
    image: devlikeapro/waha:latest
    platform: linux/amd64
    container_name: socialmei-waha
    restart: unless-stopped
    environment:
      WHATSAPP_HOOK_URL: ${WHATSAPP_HOOK_URL:-https://socialmei.54-94-213-7.sslip.io/}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_HOOK_EVENTS: message
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:?Defina WAHA_DASHBOARD_USERNAME no .env}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?Defina WAHA_DASHBOARD_PASSWORD no .env}
      WAHA_API_KEY: ${WAHA_API_KEY:?Defina WAHA_API_KEY no .env}
      WAHA_NAMESPACE: all
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media

volumes:
  postgres_data:
  n8n_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
  waha_sessions:
  waha_media:
